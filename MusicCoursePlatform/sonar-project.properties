# SonarQube Project Configuration
# Sprint 6 – Statistical Code Review
#
# Usage (after generating a token at http://localhost:9000):
#   mvn clean compile sonar:sonar -Dsonar.token=<YOUR_TOKEN>
#
# Or with the standalone sonar-scanner CLI:
#   sonar-scanner -Dsonar.token=<YOUR_TOKEN>

sonar.projectKey=music-course-platform
sonar.projectName=Music Course Platform
sonar.projectVersion=1.0

# SonarQube server URL (default port)
sonar.host.url=http://localhost:9000

# Source / test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Compiled class output (required for Java analysis)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Java source level (must match pom.xml)
sonar.java.source=17

# File encoding
sonar.sourceEncoding=UTF-8

# Exclude generated / build artefacts
sonar.exclusions=target/**

# Exclude test sources from copy-paste duplication detection.
# Test classes intentionally share setUp / tearDown patterns; flagging them
# as duplicates produces noise without actionable refactoring opportunities.
sonar.cpd.exclusions=src/test/java/**

